[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funq-mcp"
version = "0.1.0"
description = "Local MCP bridge to Funq Qt GUI testing"
requires-python = ">=3.10"
dependencies = ["mcp>=1.26,<2"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
funq-mcp = "funq_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
